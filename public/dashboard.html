<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1">
    <meta name="author" content="Sujith G">
    <meta name="description" content="Sujith G | Portfolio - Dashboard">

    <title>Sujith G - Portfolio | Dashboard</title>

    <link rel="icon" type="image/x-icon" href="assets/ico/Sg.png">

    <!-- CSS Plugins -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!---->

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="stylesheet" type="text/css" href="css/dashboard.css">
    <link rel="stylesheet" type="text/css" href="css/responsive.css">
    <link rel="stylesheet" type="text/css" href="css/anim.css">
    <!---->

    <!-- JS Plugins -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js" defer></script>
    <!---->

    <!-- Custom JS -->
    <script src="js/custom.js" defer></script>
    <script src="js/firebase.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/formHandler.js" defer></script>
    <!---->
</head>

<body class="dashboard-page">

    <!-- Loading -->
    <div class="pre-loader">
        <span></span>
    </div>
    <!---->

    <!-- Block -->
    <div class="block dashboard">
        <div class="dialog dashboard">
            <header class="dialog-header">
                <h4 class="dialog-title">Dashboard Login</h4>
            </header>
            <main class="dialog-main">
                <div class="dialog-form-output login-form-output"></div>
                <form class="dialog-form">
                    <div class="field-items">
                        <div class="input-item">
                            <input type="password" class="input password" placeholder="Password">
                        </div>
                    </div>
                </form>
            </main>
            <footer class="dialog-footer">
                <button class="dialog-btn dashboard-login">Login</button>
            </footer>
        </div>
    </div>
    <!---->

    <!-- Dialog Change Password -->
    <dialog class="dialog dialog-password">
        <header class="dialog-header">
            <h4 class="dialog-title">Change Password</h4>
            <div class="dialog-close" onclick='toggleDialog("dialog-password")'>
                <span class="material-symbols-outlined icon">close</span>
            </div>
        </header>
        <main class="dialog-main">
            <div class="dialog-form-output password-form-output"></div>
            <form class="dialog-form">
                <div class="field-items">
                    <div class="input-item">
                        <input type="text" class="input current-password" placeholder="Current Password">
                    </div>
                    <div class="input-item">
                        <input type="text" class="input new-password" placeholder="New Password">
                    </div>
                    <div class="input-item">
                        <input type="text" class="input confirm-password" placeholder="Confirm Password">
                    </div>
                </div>
            </form>
        </main>
        <footer class="dialog-footer">
            <button class="dialog-btn change-password">Change</button>
        </footer>
    </dialog>
    <!---->

    <!-- Dialog File Upload -->
    <dialog class="dialog dialog-fileUpload">
        <header class="dialog-header">
            <h4 class="dialog-title">File Upload</h4>
            <div class="dialog-close" onclick='toggleDialog("dialog-fileUpload")'>
                <span class="material-symbols-outlined icon">close</span>
            </div>
        </header>
        <main class="dialog-main">
            <div class="dialog-form-output file-form-output"></div>
            <form class="dialog-form">
                <div class="file-preview"></div>
                <div class="field-items">
                    <div class="input-item">
                        <input type="text" class="input file-name" placeholder="File Name">
                    </div>
                </div>
            </form>
        </main>
        <footer class="dialog-footer">
            <button class="dialog-btn reset" disabled>Reset</button>
            <button class="dialog-btn upload" disabled>Upload</button>
            <button class="dialog-btn attach">Attach</button>
        </footer>
    </dialog>
    <!---->

    <!-- Dialog Message -->
    <dialog class="dialog dialog-message">
        <header class="dialog-header">
            <h4 class="dialog-title">Message</h4>
            <div class="dialog-close" onclick='toggleDialog("dialog-message")'>
                <span class="material-symbols-outlined icon">close</span>
            </div>
        </header>
        <div class="dialog-content message-details"></div>
    </dialog>
    <!---->

    <!-- Dialog Visitor -->
    <dialog class="dialog dialog-visitor">
        <header class="dialog-header">
            <h4 class="dialog-title">Visitor Details</h4>
            <div class="dialog-close" onclick='toggleDialog("dialog-visitor")'>
                <span class="material-symbols-outlined icon">close</span>
            </div>
        </header>
        <div class="dialog-content visitor-details"></div>
    </dialog>
    <!---->

    <!-- Header -->
    <header class="dashboard-header">
        <div class="container">
            <div class="navbar-dashboard">
                <div>
                    <h4 class="dashboard-title">Dashboard</h4>
                </div>
                <div class="dashboard-items">
                    <div class="item item-lock" onclick='toggleDialog("dialog-password")'>
                        <span class="material-symbols-outlined icon">lock</span>
                    </div>
                    <div class="item item-mode" onclick="toggleMode()">
                        <span class="material-symbols-outlined icon mode-icon">light_mode</span>
                    </div>
                    <div class="item item-notification" onclick="initNotification('toggle')">
                        <span class="material-symbols-outlined icon">notifications</span>
                        <span class="notification-count"></span>
                    </div>
                    <div class="notification-window">
                        <div class="notification-header">
                            <h4 class="title">Notifications</h4>
                            <span class="link" onclick="initNotification('clear')">Mark all as read</span>
                        </div>
                        <div class="content"></div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </header>
    <!---->

    <main>

        <!-- Section Dashboard -->
        <section class="section section-dashboard" id="dashboard">
            <div class="container">
                <div class="layout layout-settings">
                    <div class="settings-item appLive-btn" onclick='initSettings("appLive")'>
                        <span class="material-symbols-outlined icon">computer</span>
                        <div class="content">
                            <h5 class="name">Website Status</h5>
                            <span class="status appLiveText"></>
                        </div>
                    </div>
                    <div class="settings-item dashboardLock-btn" onclick='initSettings("dashboardLock")'>
                        <span class="material-symbols-outlined icon">lock</span>
                        <div class="content">
                            <h5 class="name">Dashboard Lock</h5>
                            <span class="status dashboardLockText"></span>
                        </div>
                    </div>
                    <div class="settings-item appMode-btn" onclick='updateMode()'>
                        <span class="material-symbols-outlined icon">light_mode</span>
                        <div class="content">
                            <h5 class="name">Theme Mode</h5>
                            <span class="status appModeText"></span>
                        </div>
                    </div>
                    <div class="settings-item themeColor-btn">
                        <span class="material-symbols-outlined icon">palette</span>
                        <div class="content">
                            <h5 class="name">Theme Color</h5>
                            <div class="color-picker1"><input type="range" min="0" max="360" onchange="updateColor(this.value)"></div>
                        </div>
                    </div>
                    <div class="settings-item bgEffect-btn" onclick='initSettings("hueEffect")'>
                        <span class="material-symbols-outlined icon">masked_transitions</span>
                        <div class="content">
                            <h5 class="name">Hue Effect</h5>
                            <span class="status hueEffectText"></span>
                        </div>
                    </div>
                </div>
                <div class="dashboard-table">
                    <div class="table-header">
                        <div class="table-items">
                            <button class="item-btn" onclick='toggleDialog("dialog-fileUpload")'><span class="material-symbols-outlined icon">upload</span></button>
                        </div>
                        <div class="table-nav">
                            <button class="nav-btn nav-btn1 active" data-filter="table-messages">Messages</button>
                            <button class="nav-btn nav-btn2" data-filter="table-visitors">Visitors</button>
                            <button class="nav-btn nav-btn3" data-filter="table-files">Files</button>
                        </div>
                    </div>
                    <div class="table-content active" data-category="table-messages">
                        <table class="messages-data"></table>
                    </div>
                    <div class="table-content" data-category="table-visitors">
                        <table class="visitors-data"></table>
                    </div>
                    <div class="table-content" data-category="table-files">
                        <table class="files-data"></table>
                    </div>
                </div>
            </div>
        </section>
        <!---->

    </main>

</body>

</html>
