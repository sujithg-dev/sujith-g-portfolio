<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1">
    <meta name="author" content="Sujith G">
    <meta name="description" content="Sujith G | Portfolio - Dashboard">

    <title>Sujith G - Portfolio | Dashboard</title>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- CSS Plugins -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!---->

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="stylesheet" type="text/css" href="css/dashboard.css">
    <link rel="stylesheet" type="text/css" href="css/anim.css">
    <!---->

    <!-- JS Plugins -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js" defer></script>
    <!---->

    <!-- Custom JS -->
    <script src="js/app_config.js" defer></script>
    <script src="js/app_dashboard.js" defer></script>
    <script src="js/app_theme.js" defer></script>
    <!---->
</head>

<body class="dashboard-page">

    <!-- Loading -->
    <div class="pre-loader">
        <span></span>
    </div>
    <!---->

    <div class="home-effect1"></div>
    <div class="home-effect2"></div>
    <div class="home-effect3"></div>


    <!-- Block -->
    <div class="block dashboard">
        <div class="window dashboard">
            <header>
                <h6>Dashboard Login</h6>
            </header>
            <form>
                <div class="form-text login"></div>
                <div class="form-input">
                    <input type="password" class="input loginPin" placeholder="Enter Password">
                </div>
                <div class="form-btn">
                    <button type="button" class="btn submit-dashboardLogin act"><span class="material-symbols-outlined">arrow_forward</span></button>
                </div>
            </form>
        </div>
    </div>
    <!---->

    <!-- Dialog Change Password -->
    <dialog class="window window-password">
        <header>
            <h6>Change Password</h6>
            <span class="material-symbols-outlined" onclick='toggleDialog("window-password")'>close</span>
        </header>
        <form>
            <div class="form-text contactFormError"></div>
            <div class="form-input">
                <input type="text" class="input currentPin" placeholder="Current Password">
                <input type="text" class="input newPin" placeholder="New Password">
                <input type="text" class="input confirmPin" placeholder="Confirm Password">
            </div>
            <div class="form-btn">
                <button type="button" class="btn reset-passwordChange"><span class="material-symbols-outlined">close</span></button>
                <button type="button" class="btn submit-passwordChange"><span class="material-symbols-outlined">arrow_forward</span></button>
            </div>
        </form>
    </dialog>
    <!---->

    <!-- Dialog File Upload -->
    <dialog class="window window-file">
        <header>
            <h6>File Upload</h6>
            <span class="material-symbols-outlined" onclick='toggleDialog("window-file")'>close</span>
        </header>
        <form>
            <div class="form-img"></div>
            <div class="form-text file-text"></div>
            <div class="form-input">
                <input type="text" class="input file-name" placeholder="File Name">
                <input type="text" class="input in-certInstitute d-none" placeholder="Institution Name">
            </div>

            <div>

            </div>
            <div class="form-btn">
                <select class="select file-type" onchange='checkFormInput()'>
                    <option value="file">File</option>
                    <option value="certificate">Certificate</option>
                </select>
                <button type="button" class="btn reset-file"><span class="material-symbols-outlined">close</span></button>
                <button type="button" class="btn attach-file"><span class="material-symbols-outlined">attachment</span></button>
                <button type="button" class="btn upload-file"><span class="material-symbols-outlined">upload</span></button>
            </div>
        </form>
    </dialog>
    <!---->

    <!-- Dialog Message Info -->
    <dialog class="window window-message">
        <header>
            <h6>Message</h6>
            <span class="material-symbols-outlined" onclick='toggleDialog("window-message")'>close</span>
        </header>
        <div class="window-content">
            <div>
                <p>Name:</p>
                <span class="txtName"></span>
            </div>
            <div>
                <p>Email:</p>
                <span class="txtEmail"></span>
            </div>
            <div>
                <ul class="txtMessage"></ul>
            </div>
        </div>
    </dialog>
    <!---->

    <!-- Header -->
    <header>
        <div class="container">
            <div class="navbar-dashboard">
                <h4>Dashboard</h4>
                <div class="navbar-tools">
                    <div class="btn btn-lock" onclick='toggleDialog("window-password")'>
                        <span class="material-symbols-outlined icon">lock</span>
                    </div>
                    <div class="btn btn-mode" onclick="toggleMode()">
                        <span class="material-symbols-outlined icon mode-icon">light_mode</span>
                    </div>
                    <div class="btn btn-theme" onclick="togglePicker()">
                        <span class="material-symbols-outlined icon">palette</span>
                        <div class="color-picker"> <input type="range" min="0" max="360" onchange="updateColor(true, this.value)"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!---->

    <main>

        <!-- Section Dashboard -->
        <section class="section section-dashboard" id="dashboard">
            <div class="container">
                <div class="row">
                    <div class="settings-content">
                        <button class="settings-btn appLive-btn" onclick='updateSettings("appLive")'>
                            <span class="material-symbols-outlined btn-icon">computer</span>
                            <div class="btn-content">
                                <h5 class="btn-text">App Status</h5>
                                <h6 class="btn-subtext appLiveText"></h6>
                            </div>
                        </button>
                        <button class="settings-btn hueTheme-btn" onclick='updateSettings("hueTheme")'>
                            <span class="material-symbols-outlined btn-icon">person</span>
                            <div class="btn-content">
                                <h5 class="btn-text">Hue Theme</h5>
                                <h6 class="btn-subtext hueThemeText"></h6>
                            </div>
                        </button>
                        <button class="settings-btn appMode-btn" onclick='updateMode()'>
                            <span class="material-symbols-outlined btn-icon">light_mode</span>
                            <div class="btn-content">
                                <h5 class="btn-text">Theme Mode</h5>
                                <h6 class="btn-subtext appModeText"></h6>
                            </div>
                        </button>
                        <button class="settings-btn dashboardLock-btn" onclick='updateSettings("dashboardLock")'>
                            <span class="material-symbols-outlined btn-icon">lock</span>
                            <div class="btn-content">
                                <h5 class="btn-text">Dashboard Lock</h5>
                                <h6 class="btn-subtext dashboardLockText"></h6>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- FILES TABLE -->
                <div class="dashboard-table">
                    <div class="table-header">
                        <div class="table-nav">
                            <button class="nav-btn messages-btn active" id="messagesNav" onclick="toggleTable('table-messages', 'messages-btn')">Messages</button>
                            <button class="nav-btn users-btn" id="UsersNav" onclick="toggleTable('table-users', 'users-btn')">Users</button>
                            <button class="nav-btn files-btn" id="filesNav" onclick="toggleTable('table-files', 'files-btn')">Files</button>
                        </div>
                        <div class="table-btns">
                            <span class="material-symbols-outlined btn-icon" onclick='window.open("certificates.html")'>crop_free</span>
                            <span class="material-symbols-outlined btn-icon" onclick='toggleDialog("window-file")'>upload</span>
                        </div>
                    </div>
                    <div class="table-content table-messages active">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="messages-data"></tbody>
                        </table>
                    </div>
                    <div class="table-content table-users">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>User Id</th>
                                    <th>Device Type</th>
                                    <th>First Visit</th>
                                    <th>Last Visit</th>
                                    <th>Total Visits</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="users-data"></tbody>
                        </table>
                    </div>
                    <div class="table-content table-files">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>File Name</th>
                                    <th class="text-center">Type</th>
                                    <th class="text-center">Format</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="files-data"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <!---->

    </main>

</body>

</html>
